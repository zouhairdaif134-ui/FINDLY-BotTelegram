name: FINDLY Movies and Worker Tests

on:
  push:
    branches:
      - feat/findly-movies-runtime-hardening
      - feat/findly-movies-workspace-redesign
  pull_request:
    branches:
      - main
      - feat/findly-movies-runtime-hardening
    paths:
      - "src/**"
      - "dashboard/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Run tests
        run: npm test

      - name: Install dashboard dependencies
        run: npm install --no-package-lock
        working-directory: dashboard
      - name: Build dashboard
        run: npm run build
        working-directory: dashboard
