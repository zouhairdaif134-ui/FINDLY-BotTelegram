          docker exec -i "$PG_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261110120000_settings_worker_error_monitoring.sql
      - name: Verify Worker error monitoring RLS and grants
        run: |
          set -euo pipefail
