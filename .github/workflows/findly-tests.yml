name: FINDLY tests

on:
  pull_request:
    branches: [main]
  push:
    branches: ["feat/movies-phase1-security-foundation"]

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: npm test
      - run: npx --yes wrangler@4.156.1 deploy --dry-run

  monetization-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Apply minimal existing-schema fixture
        run: |
          set -euo pipefail
          PG_CONTAINER="$(docker ps -q --filter 'ancestor=postgres:17' | head -n1)"
          test -n "$PG_CONTAINER"
          docker exec -i "$PG_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/monetization_phase1_base_fixture.sql
      - name: Apply Phase 1 migration to disposable PostgreSQL
        run: |
          set -euo pipefail
          PG_CONTAINER="$(docker ps -q --filter 'ancestor=postgres:17' | head -n1)"
          docker exec -i "$PG_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261106213400_monetization_controls.sql
      - name: Apply AI hybrid-memory migration to disposable PostgreSQL
        run: |
          set -euo pipefail
          PG_CONTAINER="$(docker ps -q --filter 'ancestor=postgres:17' | head -n1)"
          docker exec -i "$PG_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261106000500_ai_user_hybrid_memory.sql
      - name: Verify monetization migration structure, grants and safe defaults
        run: |
          set -euo pipefail
          PG_CONTAINER="$(docker ps -q --filter 'ancestor=postgres:17' | head -n1)"
          docker exec -i "$PG_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/monetization_phase1_verification.sql
      - name: Verify AI memory RLS, identity scope and service-role access
        run: |
          set -euo pipefail
          PG_CONTAINER="$(docker ps -q --filter 'ancestor=postgres:17' | head -n1)"
          docker exec -i "$PG_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/ai_user_hybrid_memory_verification.sql

      - name: Apply movie queue prerequisite fixture
        run: |
          set -euo pipefail
          PG_CONTAINER="$(docker ps -q --filter 'ancestor=postgres:17' | head -n1)"
          docker exec -i "$PG_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/movie_queue_base_fixture.sql
      - name: Apply hourly movie queue migration
        run: |
          set -euo pipefail
          PG_CONTAINER="$(docker ps -q --filter 'ancestor=postgres:17' | head -n1)"
          docker exec -i "$PG_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261107020000_movie_queue.sql
      - name: Apply deterministic FIFO queue ordering migration
        run: |
          set -euo pipefail
          PG_CONTAINER="$(docker ps -q --filter 'ancestor=postgres:17' | head -n1)"
          docker exec -i "$PG_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261107170000_movie_queue_fifo_order.sql
      - name: Apply global movie duplicate protection migration
        run: |
          set -euo pipefail
          PG_CONTAINER="$(docker ps -q --filter 'ancestor=postgres:17' | head -n1)"
          docker exec -i "$PG_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261107030000_global_movie_duplicate_protection.sql
      - name: Verify movie queue security and hourly idempotency
        run: |
          set -euo pipefail
          PG_CONTAINER="$(docker ps -q --filter 'ancestor=postgres:17' | head -n1)"
          docker exec -i "$PG_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/movie_queue_verification.sql

      - name: Prepare Arabic synopsis migration fixture
        run: |
          set -euo pipefail
          PG_CONTAINER="$(docker ps -q --filter 'ancestor=postgres:17' | head -n1)"
          docker exec -i "$PG_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/movie_synopsis_base_fixture.sql
      - name: Apply Arabic synopsis migration to disposable PostgreSQL
        run: |
          set -euo pipefail
          PG_CONTAINER="$(docker ps -q --filter 'ancestor=postgres:17' | head -n1)"
          LOG_FILE="$(mktemp)"
          if ! docker exec -i "$PG_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261107180000_movie_synopsis_arabic.sql > "$LOG_FILE" 2>&1; then
            cat "$LOG_FILE"
            exit 1
          fi
          cat "$LOG_FILE"
      - name: Verify Arabic synopsis privacy, defaults and audited updates
        run: |
          set -euo pipefail
          PG_CONTAINER="$(docker ps -q --filter 'ancestor=postgres:17' | head -n1)"
          docker exec -i "$PG_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/movie_synopsis_verification.sql

