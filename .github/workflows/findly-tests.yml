name: FINDLY tests

on:
  pull_request:
    branches: [main]
  push:
    branches: ["feat/movies-phase1-security-foundation"]

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
