          docker exec -i "$PG_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/settings_worker_error_monitoring_verification.sql

      - name: Apply Telegram video metadata migration
        run: |
          set -euo pipefail
          PG_CONTAINER="$(docker ps -q --filter 'ancestor=postgres:17' | head -n1)"
          docker exec -i "$PG_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/migrations/20261110191000_movie_media_video_metadata.sql
      - name: Verify Telegram video metadata columns and constraints
        run: |
          set -euo pipefail
          PG_CONTAINER="$(docker ps -q --filter 'ancestor=postgres:17' | head -n1)"
          docker exec -i "$PG_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/movie_media_video_metadata_verification.sql
