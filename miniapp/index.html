<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B0B0F">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="FINDLY Movies — اكتشف الأفلام والمسلسلات داخل Telegram">
  <title>FINDLY Movies</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/styles.css?v=20261115-movierequests1">
  <script src="https://telegram.org/js/telegram-web-app.js?65"></script>
  <!-- Monetag Telegram Mini App SDK -->
  <script src='//libtl.com/sdk.js' data-zone='12270189' data-sdk='show_12270189'></script>
  <!-- AdsGram Interstitial for the Watch Bot handoff only -->
  <script async src="https://sad.adsgram.ai/js/sad.min.js"></script>
  <script>
    (() => {
      const haptic = (event) => {
        const target = event.target.closest('button, [data-open], .poster-card');
        if (!target || target.disabled) return;
        try { window.Telegram?.WebApp?.HapticFeedback?.impactOccurred('light'); } catch {}
      };
      document.addEventListener('click', haptic, true);
      const updateHeader = () => {
        document.querySelector('.topbar')?.classList.toggle('is-scrolled', window.scrollY > 12);
      };
      window.addEventListener('scroll', updateHeader, { passive: true });
      document.addEventListener('DOMContentLoaded', updateHeader);
    })();
  </script>
  <script type="module" src="/app.js?v=20261116-adsgram-series-watch1"></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="FINDLY Movies">
        <span class="brand-word">FINDLY</span>
        <span class="brand-caption">MOVIES</span>
      </a>
      <button class="icon-button" id="search-open" aria-label="بحث">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg>
      </button>
    </header>
    <main id="app" aria-live="polite">
      <section class="loading-state" aria-label="جارٍ تحميل المكتبة">
        <div class="skeleton skeleton-hero"></div>
        <div class="skeleton-heading"></div>
        <div class="skeleton-row"><i></i><i></i><i></i><i></i></div>
      </section>
    </main>
    <nav class="bottom-nav" aria-label="التنقل الرئيسي">
      <button data-tab="home" class="active"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg></span><small>الرئيسية</small><i></i></button>
      <button data-tab="movie"><span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4m-4 6h4m10-6h4m-4 6h4"/></svg></span><small>الأفلام</small><i></i></button>
      <button data-tab="series"><span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m8 4 4 5 4-5M8 20l4-5 4 5"/></svg></span><small>المسلسلات</small><i></i></button>
      <button data-tab="favorites"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M20.8 8.7c0 5.1-8.8 11-8.8 11s-8.8-5.9-8.8-11A4.7 4.7 0 0 1 12 6.1a4.7 4.7 0 0 1 8.8 2.6Z"/></svg></span><small>قائمتي</small><i></i></button>
    </nav>
  </div>
  <div id="toast" class="toast" role="status"></div>
</body>
</html>
